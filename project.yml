# XcodeGen-konfigurasjon. Kjør `xcodegen generate` for å lage Amerikaneren.xcodeproj.
name: Amerikaneren
options:
  bundleIdPrefix: no.froiland
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nb

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Amerikaneren

targets:
  Amerikaneren:
    type: application
    platform: iOS
    sources:
      - Amerikaneren
    entitlements:
      path: Amerikaneren/Amerikaneren.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.froiland.amerikaneren
        TARGETED_DEVICE_FAMILY: "1,2"

  AmerikanerenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Amerikaneren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.froiland.amerikaneren.tests
