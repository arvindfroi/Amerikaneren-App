name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Bygg og test (iOS-simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer Xcode-prosjekt
        run: xcodegen generate

      - name: Bygg og kjør tester
        run: |
          set -o pipefail
          xcodebuild test \
            -project Amerikaneren.xcodeproj \
            -scheme Amerikaneren \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100
